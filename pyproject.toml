[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aparecium"
version = "3.0.0rc1"
description = "Reconstruct short English text from full MPNet token matrices."
authors = [{name="SentiChain"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "ATTRIBUTIONS.md", "UPSTREAM_LICENSE", "NOTICE"]
dependencies = [
  "torch>=2.6,<3",
  "transformers>=5,<6",
  "huggingface-hub>=1,<2",
  "safetensors>=0.5,<1",
  "numpy>=1.24,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
"Homepage" = "https://github.com/SentiChain/aparecium"
"Source Code" = "https://github.com/SentiChain/aparecium"
"Tracker" = "https://github.com/SentiChain/aparecium/issues"

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
dev = ["build>=1.2", "twine>=6", "httpx>=0.28", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.scripts]
aparecium = "aparecium.__main__:main"
aparecium-serve = "aparecium.service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aparecium*"]
namespaces = false
